input:
  file_path: "data/INEGI_DENUE_14062026.csv"
  encoding: "latin-1"
  chunk_size: 50000

columns:
  mapping:
    "ID": "id"
    "Nombre de la Unidad Económica": "nombre_comercial"
    "Razón social": "razon_social"
    "Código de la clase de actividad SCIAN": "codigo_actividad"
    "Nombre de clase de la actividad": "nombre_actividad"
    "Entidad federativa": "entidad"
    "Municipio": "municipio"
    "Localidad": "localidad"
    "Número de teléfono": "telefono"
    "Correo electrónico": "email"
    "Sitio en Internet": "sitio_web"
    "Descripcion estrato personal ocupado": "estrato_personal"

cleaning:
  drop_duplicates: true
  subset_duplicates: ["id"]
  require_contact: "both"
  fillna:
    telefono: ""
    email: ""
    sitio_web: ""
    estrato_personal: "NO ESPECIFICADO"

filters:
  codigos_actividad: []
  entidades: []

website_verification:
  enabled: true
  timeout: 5
  max_retries: 1
  user_agent: "Mozilla/5.0 (compatible; NorfroxBot/1.0; +https://norfrox.com/scout)"
  verify_ssl: false
  allowed_status_codes: [200, 301, 302]